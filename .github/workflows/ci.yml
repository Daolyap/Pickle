name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CI: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pickle.slnx

      - name: Build (warnings are errors)
        run: dotnet build Pickle.slnx --no-restore

      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format Pickle.slnx --no-restore --verify-no-changes

      - name: Unit tests
        run: dotnet test --solution Pickle.slnx --no-build

      - name: End-to-end tests (real pty)
        if: runner.os == 'Linux'
        run: |
          pip install --quiet pyte
          python3 tests/Pickle.E2E/run_e2e.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'src/Pickle/bin/Debug/net10.0/pickle.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pickle --version failed" }
          & $exe -c 'Get-Process | Select-Object -First 1 Name, Id; pk version'
          if ($LASTEXITCODE -ne 0) { throw "pickle -c failed" }

      - name: End-to-end tests (Windows ConPTY)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: 1
          PICKLE_E2E_RAW: 1
        run: |
          pip install --quiet pyte pywinpty
          python tests/Pickle.E2E/run_e2e.py --pickle src/Pickle/bin/Debug/net10.0/pickle.exe -k e2e_input
          if ($LASTEXITCODE -ne 0) { throw "end-to-end tests failed" }

  package-windows:
    # win-arm64 is built on the x64 agent like in the release, where its pickle.exe cannot run.
    name: Package (${{ matrix.rid }} single file + MSI)
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: ./packaging/publish.ps1 -Rid ${{ matrix.rid }} -Output artifacts/publish/${{ matrix.rid }}

      - name: Smoke test published exe
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/win-x64/pickle.exe'
          & $exe -c 'Get-Date -Format yyyy; (Get-Command Get-FileHash).Source'
          if ($LASTEXITCODE -ne 0) { throw "published pickle.exe failed" }

      - name: Cache the Cascadia Code release
        uses: actions/cache@v4
        with:
          path: artifacts/font-cache
          key: cascadia-code-2407.24

      - name: Build MSI
        shell: pwsh
        run: |
          ./packaging/wix/build-msi.ps1 -Rid ${{ matrix.rid }} -PublishDir artifacts/publish/${{ matrix.rid }} -Output artifacts/msi
          $fragment = Get-Content artifacts/msi-work/pickle.json -Raw | ConvertFrom-Json
          if (-not $fragment.schemes) { throw "pickle --write-terminal-fragment (run by the MSI at install time) wrote no colour scheme" }

      - uses: actions/upload-artifact@v4
        with:
          name: pickle-${{ matrix.rid }}
          path: |
            artifacts/publish/${{ matrix.rid }}/pickle.exe
            artifacts/msi/*.msi
          if-no-files-found: error

  package-fedora:
    name: Package (Fedora RPM, linux-x64)
    needs: build-test
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 30
    steps:
      - name: Install build tools and .NET runtime dependencies
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip findutils rpm-build python3 libicu openssl-libs krb5-libs zlib

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file binary
        run: scripts/publish.sh linux-x64

      - name: Build RPM
        run: packaging/rpm/build-rpm.sh "0.0.0-ci.${{ github.run_number }}" artifacts/publish/linux-x64/pickle artifacts/rpm

      - name: Install and smoke test
        run: |
          # Main package plus one module (the others only add weak dependencies on tools like nmap and podman).
          dnf install -y --setopt=install_weak_deps=False artifacts/rpm/pickle-[0-9]*.rpm artifacts/rpm/pickle-module-explain-*.rpm
          rpm -qi pickle
          rpm -qp --provides artifacts/rpm/pickle-modules-all-*.rpm
          test "$(ls artifacts/rpm/pickle-module-*.rpm | wc -l)" -ge 8
          test -f /etc/pickle/modules.d/explain
          cd /tmp
          pickle -c 'Get-Date -Format yyyy; (Get-Command Get-FileHash).Source; (Get-Module -ListAvailable Microsoft.PowerShell.PSResourceGet).Name'
          pickle -c 'pk module list | Out-String' | grep -i explain
          pickle -c 'pk explain tar -xzf a.tgz' | grep -i extract

      - uses: actions/upload-artifact@v4
        with:
          name: pickle-fedora-rpm
          path: artifacts/rpm/*.rpm
          if-no-files-found: error
