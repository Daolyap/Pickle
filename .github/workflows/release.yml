name: Release

# Push a tag like v0.2.0 (or run manually) to build binaries for every platform, MSIs, checksums,
# package-manager manifests, and a GitHub Release. See .claude/skills/release/SKILL.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: ./packaging/publish.ps1 -Rid ${{ matrix.rid }} -Version ${{ needs.version.outputs.version }} -Output out/${{ matrix.rid }}
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $rid = '${{ matrix.rid }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($rid -like 'win-*') {
            Copy-Item "out/$rid/pickle.exe" "dist/pickle-$v-$rid.exe"
            Compress-Archive -Path "out/$rid/pickle.exe" -DestinationPath "dist/pickle-$v-$rid.zip"
          } else {
            chmod +x "out/$rid/pickle"
            tar -C "out/$rid" -czf "dist/pickle-$v-$rid.tar.gz" pickle
          }
      - name: Build MSI
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./packaging/wix/build-msi.ps1 -Rid ${{ matrix.rid }} -PublishDir out/${{ matrix.rid }} -Version ${{ needs.version.outputs.version }} -Output dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  rpm:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install rpmbuild
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip findutils rpm-build
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x64
          path: linux
      - name: Build RPM
        run: |
          v='${{ needs.version.outputs.version }}'
          mkdir -p bin && tar -C bin -xzf "linux/pickle-$v-linux-x64.tar.gz"
          packaging/rpm/build-rpm.sh "$v" bin/pickle dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rpm
          path: dist/*.rpm

  release:
    needs: [version, binaries, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and manifests
        run: |
          v='${{ needs.version.outputs.version }}'
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          python3 packaging/make_manifests.py --version "$v" --dist dist --repo "${{ github.repository }}" --out dist/manifests
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Pickle ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.rpm
            dist/*.msi
            dist/SHA256SUMS.txt
            dist/manifests/**
      - name: Update Scoop bucket manifest
        run: |
          cp dist/manifests/scoop/pickle.json bucket/pickle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pickle.json
          git commit -m "scoop: pickle ${{ needs.version.outputs.version }}" || exit 0
          git push origin HEAD:${{ github.event.repository.default_branch }} || echo "::warning::Could not push the Scoop manifest (branch protection?)"

  winget:
    needs: [version, release]
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::notice::WINGET_TOKEN secret not set; skipping winget submission. See .claude/skills/release/SKILL.md."
            exit 0
          }
          $v = '${{ needs.version.outputs.version }}'
          $base = "https://github.com/${{ github.repository }}/releases/download/v$v"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Daolyap.Pickle --version $v `
            --urls "$base/pickle-$v-win-x64.exe|x64" "$base/pickle-$v-win-arm64.exe|arm64" `
            --submit --token $env:WINGET_TOKEN
